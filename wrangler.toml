# Template config for the "Deploy to Cloudflare button".
# On deploy, Cloudflare **auto-creates** the D1 / R2 / Queue using the resource names below and backfills the generated ids into the repository you cloned.
# For your own production deployment use wrangler.local.toml (see the README "self-hosting" section); do not put your real ids in this file.
name = "resend-mail-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# D1: database_id is a placeholder, auto-created and backfilled on deploy.
# The schema for a brand-new empty database is created automatically on the Worker's first request (no need to run migrations manually).
[[d1_databases]]
binding = "DB"
database_name = "resend-webhooks-db"
database_id = "<DATABASE_ID>"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "resend-mail-attachments"

# SPA static directory: all requests hit the Worker first (for auth) and fall back to static assets when they don't match /api, /webhook, or /health
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
# The values below are template defaults; the setup wizard overrides them with the domain / sender you enter (stored in your own D1, secrets never leave your account).
SEND_FROM_ADDRESS = "inbox@example.com"
SEND_FROM_NAME = "Inbox"
# The setup wizard points the inbound catch-all rule at this Worker script name; the frontend auto-corrects it based on the actual domain visited.
WORKER_NAME = "resend-mail-api"
# Subrequest budget available for merged-send "per-recipient loop". The free plan caps a single request at 50, so we keep a margin of 5 and use 45.
MERGE_SUBREQ_BUDGET = "45"

# CF inbound async parse queue (the second stage of the never-lose pipeline, see src/inbound-email.ts). Auto-created on deploy.
[[queues.producers]]
binding = "INBOUND_QUEUE"
queue = "resend-mail-inbound"

[[queues.consumers]]
queue = "resend-mail-inbound"
# One invocation per message: a large-attachment email (base64 + parsing) is CPU/memory intensive, and batching would make several messages share the same budget, so processing one at a time is more stable.
max_batch_size = 1
max_retries = 5

# Recovery cron: periodically re-enqueues inbound messages that were stored in R2 but not fully parsed (never-lose self-healing, see src/inbound-email.ts).
[triggers]
crons = ["*/15 * * * *"]

[dev]
port = 8787
