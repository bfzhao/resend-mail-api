name = "resend-mail-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "resend-webhooks-db"
database_id = "cc445fd1-20b6-44c5-872f-5acf78834313"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "resend-mail-attachments"

# SPA 静态目录：所有请求先到 Worker（做 Basic Auth），未命中 /api、/webhook、/health 时回退到静态资源
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
SEND_FROM_ADDRESS = "support@notionmanager.com"
SEND_FROM_NAME = "support"
# 合并发送「逐人循环」可用的子请求预算。免费版单次请求上限 50，故留 5 余量取 45。
# 付费版单次 10000 子请求，可改为 9000 等更大值。
MERGE_SUBREQ_BUDGET = "45"

# CF 入向异步解析队列（never-lose 流水线第二段，见 src/inbound-email.ts）。
# ⚠️ 部署前需先建队列，否则 `wrangler deploy` 会报找不到队列：
#     wrangler queues create resend-mail-inbound
[[queues.producers]]
binding = "INBOUND_QUEUE"
queue = "resend-mail-inbound"

[[queues.consumers]]
queue = "resend-mail-inbound"
# ⚠️ 每条一次调用：一封大附件邮件（base64 + 解析）很吃 CPU/内存，批量会让多封共用同一预算，
# 免费档 10ms CPU 下更容易整批超限。个人邮箱量小，逐条处理更稳。
max_batch_size = 1
max_retries = 5

# 恢复 cron：定期把「已落 R2 但没解析完」的入向邮件重新入队（never-lose 自愈，见 src/inbound-email.ts）。
[triggers]
crons = ["*/15 * * * *"]

[dev]
port = 8787
